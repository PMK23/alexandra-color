<head>

    <title>Лицензии и разрешения — Александра</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;

            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 800px;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);

        }
        h1 {
            color: #e0d1b8;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }
        p {
            font-size: 1.1em;
            line-height: 1.8;

            margin-bottom: 30px;

        }
        .license-img {
            max-width: 100%;
            border-radius: 10px;
            border: 2px solid #444;

        }
        .btn-back {
            display: inline-block;
            padding: 12px 30px;
            background-color: #e0d1b8;
            color: #111;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            text-transform: uppercase;
            transition: background 0.3s;
            letter-spacing: 1px;

        .btn-back:hover {

</head>
