<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171512">
  <meta name="description" content="Информация о партнёрстве и образовательной деятельности Александры.">
  <title>Лицензии и разрешения — Александра</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #171512;
      --cream: #e5d5bd;
      --cream-light: #f3e9dc;
      --muted: #c7beb3;
      --line: rgba(229,213,189,.22);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      display: grid;
      place-items: center;
      color: #fff;
      background:
        radial-gradient(ellipse at 15% 10%, rgba(130,105,76,.18), transparent 42%),
        radial-gradient(ellipse at 90% 90%, rgba(130,105,76,.12), transparent 38%),
        var(--bg);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      width: min(100%, 820px);
      padding: clamp(24px, 5vw, 48px);
      text-align: center;
      background: rgba(255,255,255,.045);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
    }
    .eyebrow {
      margin: 0 0 14px;
      color: var(--cream);
      font-size: .72rem;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 24px;
      color: var(--cream-light);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 400;
    }
    p {
      margin: 0 0 28px;
      color: #d8d0c7;
      font-size: 1.02rem;
      line-height: 1.8;
      text-align: left;
    }
    .license-img {
      width: 100%;
      height: auto;
      margin: 0 auto 30px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 14px;
      background: #fff;
    }
    .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 13px 25px;
      border-radius: 999px;
      color: #211d18;
      background: var(--cream);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: .09em;
      font-size: .76rem;
      font-weight: 700;
      transition: background .25s ease, transform .25s ease;
    }
    .button:hover { background: #fff4e6; transform: translateY(-2px); }
    .button:focus-visible { outline: 2px solid var(--cream-light); outline-offset: 4px; }
  </style>
</head>
<body>
  <main class="container">
    <p class="eyebrow">Документы и информация</p>
    <h1>Лицензии и разрешения</h1>
    <p>Слесарева Александра Павловна является партнёром ООО МИДНО «Московская школа бизнеса» и проводит практическую часть обучения по дополнительным программам для мастеров и тренеров «Парикмахерское искусство».</p>
    <img
      src="https://f2.dikidi.net/c28/v27891/2kiulu3p0b.jpg"
      alt="Документ о партнёрстве"
      class="license-img"
      loading="lazy"
    >
    <a class="button" href="index.html">← Вернуться на главную</a>
  </main>
</body>
</html>
